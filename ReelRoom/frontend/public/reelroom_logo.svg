<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!-- ReelRoom brand mark: a film reel on a forest ticket square -->
  <rect x="4" y="4" width="88" height="88" rx="22" fill="#263D32"/>
  <!-- reel ring -->
  <circle cx="48" cy="48" r="26" fill="none" stroke="#F4F1E9" stroke-width="5.5"/>
  <!-- sprocket holes -->
  <g fill="#F4F1E9">
    <circle cx="48" cy="28.5" r="4.6"/>
    <circle cx="66.9" cy="41.6" r="4.6"/>
    <circle cx="59.6" cy="63.9" r="4.6"/>
    <circle cx="36.4" cy="63.9" r="4.6"/>
    <circle cx="29.1" cy="41.6" r="4.6"/>
  </g>
  <!-- play triangle -->
  <path d="M44 38.5 L59 48 L44 57.5 Z" fill="#D97A64"/>
</svg>
